<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>null undefined</title>
    <script>
      let nameUndefined = undefined;
      let nameNull = null;
      let anotherNull = null;
      let anotherUndefined = undefined;

      console.log(typeof nameNull); // => object
      console.log(typeof nameUndefined); // => undefined

      console.log(nameNull == nameUndefined); // => true
      console.log(nameNull === nameUndefined); // = > false

      // Different variables with the same value compare as equal.
      console.log(nameNull == anotherNull); // => true
      console.log(nameNull === anotherNull); // => true

      console.log(nameUndefined == anotherUndefined); // => true
      console.log(nameUndefined === anotherUndefined); // => true
    </script>
  </head>
  <body></body>
</html>
