<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Types</title>
    <script>
      // or start script => node test.js

      /*_________________Elementary Types_________________*/

      var numberExample = 10; /*type number*/

      console.log("typeof numberExample - " + typeof numberExample); // => number
      console.log(numberExample); // => 10
      console.log("------------------------------------");

      var stringExample = "text"; /*type string*/
      console.log("typeof stringExample - " + typeof stringExample); // => string
      console.log(stringExample); // => text
      console.log("------------------------------------");

      var booleanExample = true; /*type boolean*/
      console.log(booleanExample); // => true
      console.log("typeof booleanExample - " + typeof booleanExample); // => boolean
      console.log("------------------------------------");

      var nullExample = null; /*type null*/
      // Null is a data type indicating the absence of an object.
      console.log(nullExample); // => null
      console.log("typeof nullExample - " + typeof nullExample); // => object
      console.log("------------------------------------");

      var undefinedExample = undefined; /*type undefined*/
      console.log(undefinedExample); // undefined
      console.log("typeof undefinedExample - " + typeof undefinedExample); // undefined
      console.log("------------------------------------");

      /*_________________Object Types_________________*/

      var currentDate = new Date(); // Object
      console.log(currentDate); // example - Sun Jan 09 2022 00:44:04
      console.log("typeof currentDate - " + typeof currentDate); // object

      var sampleArray = [1, 2, 3, 4, "name"]; // Array
      console.log(sampleArray); // Array(5)
      console.log("typeof sampleArray - " + typeof sampleArray); // object
      console.log("------------------------------------");

      var sampleFunction = function () {
        return "f-n text";
      };
      console.log(sampleFunction()); // => result function => f-n text
      console.log(sampleFunction); // => all function
      console.log("typeof sampleFunction - " + typeof sampleFunction);
      console.log("------------------------------------");

      /*_________________Type Comparison and Conversion_________________*/

      // Equality operators: == (loose equality) and === (strict equality)
      let numberValue = 99;
      let stringValue = "99";
      let looselyEqualValues = numberValue == stringValue;
      console.log("looselyEqualValues == " + looselyEqualValues);
      let strictlyEqualValues = numberValue === stringValue;
      console.log("strictlyEqualValues === " + strictlyEqualValues);
      console.log("------------------------------------");

      let firstText = "text";
      let secondText = "text";
      let textsAreLooselyEqual = firstText == secondText;
      console.log("textsAreLooselyEqual == " + textsAreLooselyEqual);
      let textsAreStrictlyEqual = firstText === secondText;
      console.log("textsAreStrictlyEqual === " + textsAreStrictlyEqual);
      console.log("------------------------------------");

      let numberOne = 1;
      let booleanTrue = true;
      let numberAndBooleanAreLooselyEqual = numberOne == booleanTrue;
      console.log(
        "numberAndBooleanAreLooselyEqual == " + numberAndBooleanAreLooselyEqual,
      );

      let numberAndBooleanAreStrictlyEqual = numberOne === booleanTrue;
      console.log(
        "numberAndBooleanAreStrictlyEqual === " +
          numberAndBooleanAreStrictlyEqual,
      );

      let nullValue = null;
      let undefinedValue = undefined;
      let nullAndUndefinedAreLooselyEqual = nullValue == undefinedValue;
      console.log(
        "nullAndUndefinedAreLooselyEqual == " + nullAndUndefinedAreLooselyEqual,
      );

      let nullAndUndefinedAreStrictlyEqual = nullValue === undefinedValue;
      console.log(
        "nullAndUndefinedAreStrictlyEqual === " +
          nullAndUndefinedAreStrictlyEqual,
      );

      // ==   performs type conversion
      // ===  does not perform type conversion

      let numberToConvert = 0;
      console.log(typeof numberToConvert); // => number
      let numberAsString = numberToConvert.toString();
      console.log(typeof numberAsString); // => string

      console.log(typeof +numberAsString); // => number
      // or
      // console.log(typeof(+numberAsString - 0));     // => number

      console.log(typeof !!numberAsString); // => boolean
    </script>
  </head>
  <body></body>
</html>
