<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>while</title>
    <script>
      let counter = 0;
      while (counter < 10) {
        counter++;

        console.log(counter); // => 1, then 2, 3, 4, 5, 6, 7, 8, 9, 10
        // Add break here to stop after the first iteration; output => 1
      }
    </script>
  </head>
  <body></body>
</html>
