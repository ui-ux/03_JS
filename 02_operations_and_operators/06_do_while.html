<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>do while</title>
    <script>
      let counter = 1;

      do {
        console.log(counter); // => 1, then 2, 3, 4, 5, 6, 7, 8, 9
        counter++;
      } while (counter < 10);
      // The body runs once even if the condition is false.

      console.log("---------------------------------"); // => ---------------------------------

      function logArrayItems(items) {
        let itemIndex = 0;
        console.log("items.length = " + items.length); // => 3, then 0

        if (items.length === 0) {
          console.log("Array is empty."); // => Array is empty.
        } else {
          do {
            console.log(items[itemIndex]); // => 1, then 2, 3
            itemIndex++;
          } while (itemIndex < items.length);
        }
      }

      logArrayItems([1, 2, 3]);
      logArrayItems([]);
    </script>
  </head>
  <body></body>
</html>
