<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ternary Operator</title>
    <script>
      let firstNumber = 1;
      let secondNumber = 2;
      let smallerNumberResult = 5;
      let largerNumberResult = 7;

      let selectedResult =
        firstNumber < secondNumber ? smallerNumberResult : largerNumberResult;

      console.log("selectedResult = " + selectedResult); // => selectedResult = 5
    </script>
  </head>
  <body></body>
</html>
