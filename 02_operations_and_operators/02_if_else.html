<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>if and else</title>
    <script>
      let selectedNumber = 11;
      if (selectedNumber === 11) {
        console.log("selectedNumber is 11."); // => selectedNumber is 11.
      } else {
        console.log("selectedNumber is not 11."); // => not printed
      }

      if (selectedNumber === 12) {
        console.log("selectedNumber is 12."); // => not printed
      } else {
        console.log("selectedNumber is not 12."); // => selectedNumber is not 12.
      }
    </script>
  </head>
  <body></body>
</html>
