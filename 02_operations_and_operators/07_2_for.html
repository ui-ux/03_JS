<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Loop Over an Array</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    const cars = ["BMW", "Volvo", "Saab", "Ford", "WV"];
    let carsHtml = "";

    for (let carIndex = 0; carIndex < cars.length; carIndex++) {
      carsHtml += cars[carIndex] + "<br>";
    }

    document.getElementById("demo").innerHTML = carsHtml;
    // The page displays BMW, Volvo, Saab, Ford, and WV, each on a separate line.
  </script>
</html>
