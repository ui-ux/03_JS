<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>for of</title>
    <script>
      try {
        const coordinates = { x: 1, y: 2, z: 3 };
        for (const coordinate of coordinates) {
          console.log(coordinate); // => not reached; the plain object is not iterable
        }
      } catch {
        console.log("Plain objects are not iterable with for...of."); // => Plain objects are not iterable with for...of.
      }
      // Use Object.keys() to iterate over property names.

      try {
        const coordinates = { x: 1, y: 2, z: 3 };
        for (const propertyName of Object.keys(coordinates)) {
          console.log(propertyName); // => x, then y, z
        }
      } catch {
        console.log("Object.keys() could not be iterated."); // => not printed
      }

      try {
        const coordinates = { x: 1, y: 2, z: 3 };
        for (const coordinate of Object.values(coordinates)) {
          console.log(coordinate); // => 1, then 2, 3
        }
      } catch {
        console.log("Object.values() could not be iterated."); // => not printed
      }

      try {
        const coordinates = { x: 1, y: 2, z: 3 };
        for (const [propertyName, coordinate] of Object.entries(coordinates)) {
          console.log(propertyName, coordinate); // => x 1, then y 2, z 3
        }
      } catch {
        console.log("Object.entries() could not be iterated."); // => not printed
      }

      // try {
      //   const coordinates = { x: 1, y: 2, z: 3 };
      //   for (const index in Object.keys(coordinates)) {
      //     console.log(index); // => 0, then 1, 2
      //   }
      // } catch {
      //   console.log("Could not iterate over the object keys.");
      // }
    </script>
  </head>
  <body></body>
</html>
