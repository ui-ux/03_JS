<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>else if</title>
    <script>
      let enteredNumber = +prompt("enter", "10");
      if (enteredNumber === 11) {
        console.log("enteredNumber is 11."); // => not printed for the default input
      } else if (enteredNumber === 10) {
        console.log("enteredNumber is 10."); // default input => enteredNumber is 10.
      } else {
        console.log("enteredNumber is neither 10 nor 11."); // => not printed for the default input
      }
    </script>
  </head>
  <body></body>
</html>
