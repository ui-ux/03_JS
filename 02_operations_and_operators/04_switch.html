<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>switch</title>
    <script>
      let enteredNumber = +prompt("enter", "11"); // Unary + converts the prompt string to a number.
      switch (enteredNumber) {
        case 1:
        case 11:
          {
            console.log("Number is 1 or 11."); // default input => Number is 1 or 11.
          }
          break;
        case 2:
          {
            console.log("Number is 2."); // => Number is 2.
          }
          break;
        default: {
          console.log("Number did not match 1, 2, or 11."); // => Number did not match 1, 2, or 11.
        }
      }

      // switch also works with strings; case values must have the same type.

      let enteredText = prompt("enter", "11");
      switch (enteredText) {
        case "1":
        case "11":
          {
            console.log('Text is "1" or "11".'); // default input => Text is "1" or "11".
          }
          break;
        case "2":
          {
            console.log('Text is "2".'); // => Text is "2".
          }
          break;
        default: {
          console.log("Text did not match 1, 2, or 11."); // => Text did not match 1, 2, or 11.
        }
      }

      // Without break, execution continues into the following cases (fall-through).
      let fallThroughValue = 3;
      switch (fallThroughValue) {
        case 3: {
          console.log("Matched case 3."); // => Matched case 3.
        }
        case 2: {
          console.log("Fell through case 2."); // => Fell through case 2.
        }
        case 1: {
          console.log("Fell through case 1."); // => Fell through case 1.
        }
      }

      console.log("==========================="); // => ===========================

      function formatValue(value) {
        switch (typeof value) {
          case "number":
            console.log(value.toString(16)); // => numbers are formatted as hexadecimal
            break;
          case "string":
            console.log('"' + value + '"'); // => strings are wrapped in double quotes
            break;
          default:
            console.log(String(value)); // => other values are converted to strings
            break;
        }
      }
      formatValue(254); // => fe
      formatValue("test text"); // => "test text"
      formatValue(true); // => true
    </script>
  </head>
  <body></body>
</html>
