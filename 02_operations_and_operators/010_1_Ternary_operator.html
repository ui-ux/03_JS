<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ternary Operator with Assignment</title>
    <script>
      let firstNumber = 1;
      let secondNumber = 2;
      let largerNumber = 0;
      largerNumber = firstNumber > secondNumber ? firstNumber : secondNumber;

      // The ternary expression selects a value, which is assigned to largerNumber.
      console.log("largerNumber = " + largerNumber); // => largerNumber = 2
    </script>
  </head>
  <body></body>
</html>
